<title>TITLE</title>
<!--
  Template for a published page (for example, a claude.ai artifact).
  The artifact host adds doctype, head and body; on a normal site wrap this in a full HTML document.
  Replace TITLE, the version in the script URL and the JSON below. Nothing else is needed.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@400;500&display=swap">
<style>
  html, body { height: 100%; }
  body { margin: 0; padding: 12px 16px; box-sizing: border-box; background: #EEF1F5; overflow: hidden; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) body { background: #0C1015; } }
  :root[data-theme="dark"] body { background: #0C1015; }
  #graph { height: 100%; }
</style>
<div id="graph"></div>
<script src="https://cdn.jsdelivr.net/npm/ergomap@0.1.0/dist/ergomap.min.js"></script>
<script type="application/json" id="ergomap-data">
{
  "lang": "en",
  "title": "Example",
  "theses": [
    { "id": 1, "label": "First premise", "text": "A first premise." },
    { "id": 2, "label": "Second premise", "text": "A second premise." },
    { "id": 3, "label": "Conclusion", "text": "A conclusion that follows from both.", "from": [1, 2] }
  ]
}
</script>
<script>
  Ergomap.mount("#graph", JSON.parse(document.getElementById("ergomap-data").textContent));
</script>
